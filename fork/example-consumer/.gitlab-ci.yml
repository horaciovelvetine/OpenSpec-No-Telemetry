# Sample pipeline for the example consumer. Nothing here reaches a public registry:
# the example has no npm dependencies; OpenSpec is a plain vendored tarball.
#
# Needs:
# - a Node.js 20.19+ image (Debian-based, for curl and sha256sum) mirrored into
#   your GitLab container registry; public image registries may be unreachable
# - the project's Generic Package Registry enabled

variables:
  NODE_IMAGE: '$CI_REGISTRY/your-group/images/node:22'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  npm_config_update_notifier: 'false'

default:
  image: $NODE_IMAGE

stages:
  - test
  - release

check:
  stage: test
  script:
    - (cd vendor/openspec && sha256sum -c SHA256SUMS)
    - node bin/acme.js --version | grep -E -- '-no-telem\.[0-9]+'
    - export TEST_PREFIX="$CI_PROJECT_DIR/.tmp-prefix"
    - export FORK_TGZ="vendor/openspec/$(node -p "JSON.parse(require('fs').readFileSync('vendor/openspec/BUILD-INFO.json','utf8')).tarball")"
    - npm install -g "$FORK_TGZ" --prefix "$TEST_PREFIX" --offline --ignore-scripts --no-audit --no-fund
    - "$TEST_PREFIX/bin/openspec" --version | grep -E -- '-no-telem\.[0-9]+$'

# Tag vX.Y.Z (matching package.json) to publish a release tarball.
release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - export VERSION="$(node -p "require('./package.json').version")"
    - test "v$VERSION" = "$CI_COMMIT_TAG" || { echo "Tag $CI_COMMIT_TAG does not match package.json $VERSION"; exit 1; }
    - (cd vendor/openspec && sha256sum -c SHA256SUMS)
    - export PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/acme/$VERSION/acme-$VERSION.tgz"
    - node scripts/pack-release.mjs --url "$PACKAGE_URL" --out .
    - 'curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "acme-$VERSION.tgz" "$PACKAGE_URL"'
    - echo "Install with npx --yes $PACKAGE_URL"
  artifacts:
    paths:
      - acme-*.tgz
