name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_matrix:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            label: linux-bash
            vitest_workers: 4
          - os: macos-latest
            shell: bash
            label: macos-bash
            vitest_workers: 4
          - os: windows-latest
            shell: pwsh
            label: windows-pwsh
            vitest_workers: 2

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - name: Print environment diagnostics
        run: |
          node -p "JSON.stringify({ platform: process.platform, arch: process.arch, shell: process.env.SHELL || process.env.ComSpec || '' })"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Run tests
        env:
          VITEST_MAX_WORKERS: ${{ matrix.vitest_workers }}
        run: pnpm test

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Network and packaging audit
        run: node fork/audit-network.mjs

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Check for build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          if [ ! -f "dist/cli/index.js" ]; then
            echo "Error: CLI entry point not found"
            exit 1
          fi

  offline_artifact:
    name: Verified Offline Artifact (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test_matrix, lint]
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Build and verify the bundled dependency
        if: matrix.node == '20.19.0'
        run: node fork/pack-offline.mjs

      - name: Download artifact from Node 20 build
        if: matrix.node != '20.19.0'
        uses: actions/download-artifact@08e24e6c96ac292d9a23a3885fae3b6b1a8b3b5d # v6.0.0
        with:
          name: openspec-offline-${{ github.sha }}
          path: fork/out/

      - name: Verify the example consumer
        run: node fork/verify-example-consumer.mjs

      - name: Upload verified artifact
        if: matrix.node == '20.19.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openspec-offline-${{ github.sha }}
          path: fork/out/
          if-no-files-found: error
          retention-days: 14

  required-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [test_matrix, lint, offline_artifact]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ needs.test_matrix.result }}" != "success" ]]; then
            echo "Matrix test job failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.offline_artifact.result }}" != "success" ]]; then
            echo "Offline artifact job failed"
            exit 1
          fi
          echo "All required checks passed!"
